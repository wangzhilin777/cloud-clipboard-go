<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Clipboard Desktop</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #16324f;
      --muted: #6b7a90;
      --line: #d8e1ec;
      --accent: #2d6cdf;
      --good: #1f8f5f;
      --warn: #cc7a00;
      --bad: #d64545;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .hero {
      margin-bottom: 18px;
      padding: 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, #183a70 0%, #2d6cdf 60%, #80b3ff 100%);
      color: #fff;
      box-shadow: 0 16px 40px rgba(20, 55, 110, 0.22);
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }
    .hero p {
      margin: 0;
      opacity: 0.92;
    }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-bottom: 16px;
    }
    .card, .form-card {
      background: var(--panel);
      border: 1px solid rgba(216, 225, 236, 0.9);
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(42, 66, 112, 0.08);
    }
    .card {
      padding: 18px;
    }
    .label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .value {
      font-size: 18px;
      font-weight: 700;
      word-break: break-all;
    }
    .status-connected { color: var(--good); }
    .status-pending { color: var(--warn); }
    .status-error { color: var(--bad); }
    .form-card {
      padding: 22px;
    }
    .form-title {
      margin: 0 0 16px;
      font-size: 20px;
    }
    .form-grid {
      display: grid;
      gap: 14px 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field.full {
      grid-column: 1 / -1;
    }
    input, select, button {
      font: inherit;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fbfdff;
      color: var(--text);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:hover {
      transform: translateY(-1px);
    }
    .primary {
      background: var(--accent);
      color: #fff;
    }
    .secondary {
      background: #eaf1ff;
      color: var(--accent);
    }
    .message {
      min-height: 24px;
      margin-top: 12px;
      color: var(--muted);
    }
    .footer {
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Cloud Clipboard Desktop</h1>
      <p>本地控制面板已经接入，后续桌面端配置与状态都从这里统一收口。</p>
    </section>

    <section class="grid">
      <article class="card">
        <span class="label">连接状态</span>
        <div id="statusText" class="value">加载中</div>
      </article>
      <article class="card">
        <span class="label">设备名称</span>
        <div id="deviceNameText" class="value">-</div>
      </article>
      <article class="card">
        <span class="label">最近远端文件通知</span>
        <div id="payloadText" class="value">-</div>
      </article>
      <article class="card">
        <span class="label">最近错误</span>
        <div id="errorText" class="value">-</div>
      </article>
      <article class="card">
        <span class="label">最近手动发送</span>
        <div id="actionText" class="value">-</div>
      </article>
      <article class="card">
        <span class="label">快捷键概览</span>
        <div id="hotkeyText" class="value">-</div>
      </article>
      <article class="card">
        <span class="label">待确认剪贴板文件</span>
        <div id="pendingClipboardText" class="value">-</div>
      </article>
      <article class="card">
        <span class="label">最近缓存清理</span>
        <div id="cacheCleanupText" class="value">-</div>
      </article>
    </section>

    <section class="form-card">
      <h2 class="form-title">同步配置</h2>
      <div class="form-grid">
        <label class="field full">
          <span class="label">服务端地址</span>
          <input id="serverBase" placeholder="http://192.168.31.136:9501">
        </label>
        <label class="field">
          <span class="label">房间名</span>
          <input id="room" placeholder="default">
        </label>
        <label class="field">
          <span class="label">房间密码</span>
          <input id="roomPassword" type="password" placeholder="room password">
        </label>
        <label class="field">
          <span class="label">设备名称</span>
          <input id="deviceName" placeholder="Desktop">
        </label>
        <label class="field">
          <span class="label">轮询间隔（毫秒）</span>
          <input id="pollIntervalMs" type="number" min="200" max="3000">
        </label>
        <label class="field">
          <span class="label">通知模式</span>
          <select id="noticeMode">
            <option value="popup">系统通知</option>
            <option value="log">仅日志</option>
            <option value="off">关闭通知</option>
          </select>
        </label>
        <label class="field">
          <span class="label">失败重连间隔（毫秒）</span>
          <input id="reconnectDelayMs" type="number" min="500" max="30000">
        </label>
        <label class="field">
          <span class="label">最大自动重连次数</span>
          <input id="maxReconnectAttempts" type="number" min="1" max="20">
        </label>
        <label class="field">
          <span class="label">启动时自动打开面板</span>
          <select id="openPanelOnLaunch">
            <option value="true">开启</option>
            <option value="false">关闭</option>
          </select>
        </label>
        <label class="field full">
          <span class="label">面板监听地址</span>
          <input id="panelAddress" placeholder="127.0.0.1:9530">
        </label>
        <label class="field full">
          <span class="label">下载目录</span>
          <input id="downloadDir" placeholder="C:\\Users\\用户名\\Downloads\\CloudClipboard">
        </label>
        <label class="field">
          <span class="label">下载缓存保留（小时）</span>
          <input id="downloadCacheRetentionHours" type="number" min="1" max="720">
        </label>
        <label class="field">
          <span class="label">Windows 右键菜单</span>
          <select id="shellMenuEnabled">
            <option value="false">关闭</option>
            <option value="true">开启</option>
          </select>
        </label>
        <label class="field">
          <span class="label">剪贴板文件确认</span>
          <select id="clipboardFileConfirmEnabled">
            <option value="true">开启</option>
            <option value="false">关闭</option>
          </select>
        </label>
        <label class="field">
          <span class="label">确认窗口（秒）</span>
          <input id="clipboardFileConfirmWindowSec" type="number" min="3" max="30">
        </label>
        <label class="field">
          <span class="label">发送剪贴板文本热键</span>
          <input id="sendClipboardHotkey" placeholder="Ctrl+Alt+C">
        </label>
        <label class="field">
          <span class="label">拉取最新文本热键</span>
          <input id="fetchLatestHotkey" placeholder="Ctrl+Alt+T">
        </label>
        <label class="field">
          <span class="label">拉取最新文件到剪贴板热键</span>
          <input id="fetchLatestFileHotkey" placeholder="Ctrl+Alt+G">
        </label>
        <label class="field">
          <span class="label">下载最新文件热键</span>
          <input id="downloadLatestHotkey" placeholder="Ctrl+Alt+B">
        </label>
      </div>
      <div class="actions">
        <button class="primary" id="saveButton" type="button">保存并重连</button>
        <button class="secondary" id="reconnectButton" type="button">仅重连</button>
        <button class="secondary" id="openPanelButton" type="button">系统浏览器打开</button>
        <button class="secondary" id="sendFileButton" type="button">选择文件并发送</button>
        <button class="secondary" id="fetchLatestTextButton" type="button">拉取最新文本到剪贴板</button>
        <button class="secondary" id="fetchLatestFileToClipboardButton" type="button">拉取最新文件到剪贴板</button>
        <button class="secondary" id="downloadLatestFileButton" type="button">下载最新文件到本机</button>
        <button class="secondary" id="openDownloadDirButton" type="button">打开下载目录</button>
        <button class="secondary" id="clearDownloadDirButton" type="button">清空下载缓存</button>
        <button class="secondary" id="confirmPendingClipboardFilesButton" type="button">发送待确认剪贴板文件</button>
      </div>
      <div class="message" id="message"></div>
      <div class="footer">配置保存后会立即触发桌面客户端重连。若修改了面板监听地址，本页面需要手动用新地址重新打开。</div>
    </section>

    <section class="form-card" style="margin-top: 16px;">
      <h2 class="form-title">快速动作</h2>
      <div class="form-grid">
        <label class="field full">
          <span class="label">手动发送文本</span>
          <input id="manualText" placeholder="输入要发送到同步房间的文本">
        </label>
      </div>
      <div class="actions">
        <button class="primary" id="sendTextButton" type="button">发送输入文本</button>
        <button class="secondary" id="sendClipboardTextButton" type="button">发送当前剪贴板文本</button>
      </div>
    </section>
  </div>

  <script>
    const fields = {
      serverBase: document.getElementById('serverBase'),
      room: document.getElementById('room'),
      roomPassword: document.getElementById('roomPassword'),
      deviceName: document.getElementById('deviceName'),
      pollIntervalMs: document.getElementById('pollIntervalMs'),
      noticeMode: document.getElementById('noticeMode'),
      reconnectDelayMs: document.getElementById('reconnectDelayMs'),
      maxReconnectAttempts: document.getElementById('maxReconnectAttempts'),
      openPanelOnLaunch: document.getElementById('openPanelOnLaunch'),
      panelAddress: document.getElementById('panelAddress'),
      downloadDir: document.getElementById('downloadDir'),
      downloadCacheRetentionHours: document.getElementById('downloadCacheRetentionHours'),
      shellMenuEnabled: document.getElementById('shellMenuEnabled'),
      clipboardFileConfirmEnabled: document.getElementById('clipboardFileConfirmEnabled'),
      clipboardFileConfirmWindowSec: document.getElementById('clipboardFileConfirmWindowSec'),
      sendClipboardHotkey: document.getElementById('sendClipboardHotkey'),
      fetchLatestHotkey: document.getElementById('fetchLatestHotkey'),
      fetchLatestFileHotkey: document.getElementById('fetchLatestFileHotkey'),
      downloadLatestHotkey: document.getElementById('downloadLatestHotkey'),
    };
    const manualText = document.getElementById('manualText');
    const statusText = document.getElementById('statusText');
    const deviceNameText = document.getElementById('deviceNameText');
    const payloadText = document.getElementById('payloadText');
    const errorText = document.getElementById('errorText');
    const actionText = document.getElementById('actionText');
    const hotkeyText = document.getElementById('hotkeyText');
    const pendingClipboardText = document.getElementById('pendingClipboardText');
    const cacheCleanupText = document.getElementById('cacheCleanupText');
    const message = document.getElementById('message');
    let refreshTimer = null;

    function statusClass(status) {
      const normalized = String(status || '').toLowerCase();
      if (normalized === 'trusted' || normalized === 'connected') return 'status-connected';
      if (normalized === 'pending' || normalized === 'connecting' || normalized === 'starting') return 'status-pending';
      if (normalized === 'retrying') return 'status-pending';
      if (normalized === 'error') return 'status-error';
      if (normalized === 'stopped') return 'status-error';
      return '';
    }

    function fillConfig(cfg) {
      Object.keys(fields).forEach((key) => {
        if (cfg[key] !== undefined && cfg[key] !== null) {
          fields[key].value = cfg[key];
        }
      });
      deviceNameText.textContent = cfg.deviceName || '-';
      hotkeyText.textContent = formatHotkeySummary(cfg);
    }

    function fillState(state) {
      const status = state.status || 'idle';
      statusText.textContent = state.connected ? `${status} / 已连接` : status;
      statusText.className = `value ${statusClass(status)}`;
      payloadText.textContent = state.lastPayloadTitle ? `${state.lastPayloadKind || 'file'} / ${state.lastPayloadTitle}` : '-';
      errorText.textContent = state.lastError || '-';
      actionText.textContent = state.lastActionDetail ? `${actionLabel(state.lastActionType)} / ${state.lastActionDetail}` : '-';
      pendingClipboardText.textContent = formatPendingClipboard(state);
      cacheCleanupText.textContent = formatCacheCleanup(state);
    }

    function actionLabel(actionType) {
      switch (String(actionType || '').trim()) {
        case 'file-send':
          return '发送文件';
        case 'manual-text':
          return '发送输入文本';
        case 'clipboard-text':
          return '发送剪贴板文本';
        case 'fetch-latest-text':
          return '拉取最新文本';
        case 'fetch-latest-file':
          return '拉取最新文件到剪贴板';
        case 'download-latest-file':
          return '下载最新文件';
        case 'open-download-dir':
          return '打开下载目录';
        case 'clear-download-dir':
          return '清空下载缓存';
        case 'clipboard-file-send':
          return '发送待确认剪贴板文件';
        default:
          return actionType || '动作';
      }
    }

    function formatHotkeySummary(cfg) {
      const items = [];
      if (cfg.sendClipboardHotkey) items.push(`发：${cfg.sendClipboardHotkey}`);
      if (cfg.fetchLatestHotkey) items.push(`拉：${cfg.fetchLatestHotkey}`);
      if (cfg.fetchLatestFileHotkey) items.push(`贴：${cfg.fetchLatestFileHotkey}`);
      if (cfg.downloadLatestHotkey) items.push(`下：${cfg.downloadLatestHotkey}`);
      if (cfg.shellMenuEnabled) items.push('右键菜单：开');
      if (cfg.clipboardFileConfirmEnabled) items.push(`确认窗：${cfg.clipboardFileConfirmWindowSec || 0}s`);
      return items.length ? items.join(' / ') : '未配置';
    }

    function formatPendingClipboard(state) {
      const files = Array.isArray(state.pendingClipboardFiles) ? state.pendingClipboardFiles : [];
      if (!files.length) return '-';
      const now = Date.now();
      const expiresAt = Number(state.pendingClipboardExpiresAt || 0);
      const remaining = expiresAt > now ? Math.max(0, Math.ceil((expiresAt - now) / 1000)) : 0;
      const name = String(files[0] || '').split(/[\\\\/]/).pop();
      const extra = files.length > 1 ? ` 等 ${files.length} 项` : '';
      return remaining > 0 ? `${name}${extra} / 剩余 ${remaining}s` : `${name}${extra} / 已过期`;
    }

    function formatCacheCleanup(state) {
      const removed = Number(state.lastCacheCleanupRemoved || 0);
      const at = Number(state.lastCacheCleanupAt || 0);
      if (!at) return '-';
      const timeText = new Date(at).toLocaleString();
      return `${removed} 项 / ${timeText}`;
    }

    async function loadStatus(silent = false) {
      try {
        const resp = await fetch('/api/status', { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        fillConfig(data.config || {});
        fillState(data.state || {});
        if (!silent) message.textContent = '状态已刷新';
      } catch (err) {
        message.textContent = `状态读取失败：${err.message}`;
      }
    }

    async function saveConfig() {
      message.textContent = '正在保存配置...';
      const payload = {
        serverBase: fields.serverBase.value,
        room: fields.room.value,
        roomPassword: fields.roomPassword.value,
        deviceName: fields.deviceName.value,
        pollIntervalMs: Number(fields.pollIntervalMs.value || 0),
        noticeMode: fields.noticeMode.value,
        reconnectDelayMs: Number(fields.reconnectDelayMs.value || 0),
        maxReconnectAttempts: Number(fields.maxReconnectAttempts.value || 0),
        openPanelOnLaunch: fields.openPanelOnLaunch.value === 'true',
        panelAddress: fields.panelAddress.value,
        downloadDir: fields.downloadDir.value,
        downloadCacheRetentionHours: Number(fields.downloadCacheRetentionHours.value || 0),
        shellMenuEnabled: fields.shellMenuEnabled.value === 'true',
        clipboardFileConfirmEnabled: fields.clipboardFileConfirmEnabled.value === 'true',
        clipboardFileConfirmWindowSec: Number(fields.clipboardFileConfirmWindowSec.value || 0),
        sendClipboardHotkey: fields.sendClipboardHotkey.value,
        fetchLatestHotkey: fields.fetchLatestHotkey.value,
        fetchLatestFileHotkey: fields.fetchLatestFileHotkey.value,
        downloadLatestHotkey: fields.downloadLatestHotkey.value,
      };
      try {
        const resp = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const text = await resp.text();
        if (!resp.ok) throw new Error(text || `HTTP ${resp.status}`);
        const data = JSON.parse(text);
        fillConfig(data.config || {});
        fillState(data.state || {});
        message.textContent = '配置已保存，客户端正在重连。';
      } catch (err) {
        message.textContent = `保存失败：${err.message}`;
      }
    }

    async function reconnect() {
      message.textContent = '正在触发重连...';
      try {
        const resp = await fetch('/api/reconnect', { method: 'POST' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        message.textContent = '已触发重连。';
      } catch (err) {
        message.textContent = `重连失败：${err.message}`;
      }
    }

    async function openPanelInBrowser() {
      message.textContent = '正在打开系统浏览器...';
      try {
        const resp = await fetch('/api/open-panel', { method: 'POST' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        message.textContent = '已请求系统浏览器打开控制面板。';
      } catch (err) {
        message.textContent = `打开失败：${err.message}`;
      }
    }

    async function sendFile() {
      message.textContent = '正在打开文件选择框...';
      try {
        const resp = await fetch('/api/send-file', { method: 'POST' });
        const text = await resp.text();
        if (!resp.ok) throw new Error(text || `HTTP ${resp.status}`);
        const data = JSON.parse(text || '{}');
        if (Array.isArray(data.files) && data.files.length) {
          message.textContent = `发送成功：${data.files.join('，')}`;
        } else {
          message.textContent = '已取消选择文件。';
        }
      } catch (err) {
        message.textContent = `发送失败：${err.message}`;
      }
    }

    async function sendText(fromClipboard) {
      message.textContent = fromClipboard ? '正在读取并发送剪贴板文本...' : '正在发送文本...';
      try {
        const resp = await fetch('/api/send-text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: manualText.value,
            fromClipboard,
          }),
        });
        const text = await resp.text();
        if (!resp.ok) throw new Error(text || `HTTP ${resp.status}`);
        const data = JSON.parse(text || '{}');
        if (!fromClipboard) {
          manualText.value = '';
        }
        message.textContent = `文本发送成功：${data.text || ''}`;
      } catch (err) {
        message.textContent = `文本发送失败：${err.message}`;
      }
    }

    async function fetchLatestText() {
      message.textContent = '正在拉取最新文本...';
      try {
        const resp = await fetch('/api/fetch-latest-text', { method: 'POST' });
        const text = await resp.text();
        if (!resp.ok) throw new Error(text || `HTTP ${resp.status}`);
        const data = JSON.parse(text || '{}');
        message.textContent = `已写入剪贴板：${data.text || ''}`;
      } catch (err) {
        message.textContent = `拉取文本失败：${err.message}`;
      }
    }

    async function downloadLatestFile() {
      message.textContent = '正在下载最新文件...';
      try {
        const resp = await fetch('/api/download-latest-file', { method: 'POST' });
        const text = await resp.text();
        if (!resp.ok) throw new Error(text || `HTTP ${resp.status}`);
        const data = JSON.parse(text || '{}');
        message.textContent = `下载成功：${data.path || ''}`;
      } catch (err) {
        message.textContent = `下载文件失败：${err.message}`;
      }
    }

    async function fetchLatestFileToClipboard() {
      message.textContent = '正在拉取最新文件到剪贴板...';
      try {
        const resp = await fetch('/api/fetch-latest-file-to-clipboard', { method: 'POST' });
        const text = await resp.text();
        if (!resp.ok) throw new Error(text || `HTTP ${resp.status}`);
        const data = JSON.parse(text || '{}');
        message.textContent = `已写入文件剪贴板：${data.path || ''}`;
      } catch (err) {
        message.textContent = `拉取最新文件到剪贴板失败：${err.message}`;
      }
    }

    async function openDownloadDir() {
      message.textContent = '正在打开下载目录...';
      try {
        const resp = await fetch('/api/open-download-dir', { method: 'POST' });
        const text = await resp.text();
        if (!resp.ok) throw new Error(text || `HTTP ${resp.status}`);
        message.textContent = '已打开下载目录';
      } catch (err) {
        message.textContent = `打开下载目录失败：${err.message}`;
      }
    }

    async function clearDownloadDir() {
      message.textContent = '正在清空下载缓存...';
      try {
        const resp = await fetch('/api/clear-download-dir', { method: 'POST' });
        const text = await resp.text();
        if (!resp.ok) throw new Error(text || `HTTP ${resp.status}`);
        const data = JSON.parse(text || '{}');
        message.textContent = `已清空下载缓存：${data.removed || 0} 项`;
      } catch (err) {
        message.textContent = `清空下载缓存失败：${err.message}`;
      }
    }

    async function confirmPendingClipboardFiles() {
      message.textContent = '正在发送待确认剪贴板文件...';
      try {
        const resp = await fetch('/api/confirm-pending-clipboard-files', { method: 'POST' });
        const text = await resp.text();
        if (!resp.ok) throw new Error(text || `HTTP ${resp.status}`);
        const data = JSON.parse(text || '{}');
        message.textContent = `已发送待确认剪贴板文件：${(data.files || []).join('，')}`;
        await loadStatus(true);
      } catch (err) {
        message.textContent = `发送待确认剪贴板文件失败：${err.message}`;
      }
    }

    document.getElementById('saveButton').addEventListener('click', saveConfig);
    document.getElementById('reconnectButton').addEventListener('click', reconnect);
    document.getElementById('openPanelButton').addEventListener('click', openPanelInBrowser);
    document.getElementById('sendFileButton').addEventListener('click', sendFile);
    document.getElementById('sendTextButton').addEventListener('click', () => sendText(false));
    document.getElementById('sendClipboardTextButton').addEventListener('click', () => sendText(true));
    document.getElementById('fetchLatestTextButton').addEventListener('click', fetchLatestText);
    document.getElementById('fetchLatestFileToClipboardButton').addEventListener('click', fetchLatestFileToClipboard);
    document.getElementById('downloadLatestFileButton').addEventListener('click', downloadLatestFile);
    document.getElementById('openDownloadDirButton').addEventListener('click', openDownloadDir);
    document.getElementById('clearDownloadDirButton').addEventListener('click', clearDownloadDir);
    document.getElementById('confirmPendingClipboardFilesButton').addEventListener('click', confirmPendingClipboardFiles);

    loadStatus();
    refreshTimer = setInterval(() => loadStatus(true), 2000);
    window.addEventListener('beforeunload', () => clearInterval(refreshTimer));
  </script>
</body>
</html>
